<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorecast - Your Beaches</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Drag and drop styles */
        [draggable="true"] {
            user-select: none;
        }
        [draggable="true"]:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app"></div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        
        const API_BASE = 'https://shorecast.onrender.com';
        
        // IMPORTANT: Replace these with your actual Supabase project credentials
        const SUPABASE_URL = 'https://kivqldzfitxldzymxcfu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpdnFsZHpmaXR4bGR6eW14Y2Z1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0NDAzOTcsImV4cCI6MjA4MTAxNjM5N30.TYdgeVZe7mbgeASi8npL82Ewon7b8fjN0jRi1RtZNZk';
        
        // FIXED: Renamed to supabaseClient to avoid conflict with global 'supabase' from CDN
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const DEFAULT_BEACHES = ['rhossili', 'barry-island', 'tenby-south'];
        const MAX_FREE_BEACHES = 3;
        
        const FALLBACK_TIME_SLOTS = [
            { id: 'now', label: 'right now', time: '--:--' },
            { id: 'tomorrow-am', label: 'tomorrow am', time: '08:00' },
            { id: 'tomorrow-pm', label: 'tomorrow pm', time: '17:00' },
            { id: 'day-after-am', label: 'loading...', time: '08:00' }
        ];
        
        const ARROWS = { 
            north: '↑', south: '↓', east: '→', west: '←', 
            northeast: '↗', northwest: '↖', southeast: '↘', southwest: '↙' 
        };

        // ============================================
        // STATE MANAGEMENT
        // ============================================

        let state = {
            // Auth state
            view: 'loading',
            user: null,
            userProfile: null,
            authError: null,
            authLoading: false,
            
            // Dashboard state
            mode: 'swimming',
            time: 'now',
            data: null,
            loading: true,
            error: null,
            showInfo: null,
            timeSlots: FALLBACK_TIME_SLOTS,
            userBeaches: [],
            
            // Onboarding state
            availableBeaches: [],
            selectedBeaches: [],
            
            // UI state
            showSidebar: false,
            showSettings: false,
            
            // Location filter state
            locationFilter: null
        };

        function setState(newState) {
            state = { ...state, ...newState };
            render();
        }

        function toggleSidebar() {
            setState({ showSidebar: !state.showSidebar });
        }

        function navigateTo(view) {
            // Reset location filter when leaving all-beaches page
            if (state.view === 'all-beaches' && view !== 'all-beaches') {
                state.locationFilter = null;
            }
            setState({ view, showSidebar: false });
            if (view === 'dashboard') {
                fetchData();
            } else if (view === 'all-beaches' || view === 'profile') {
                loadAvailableBeaches();
            }
        }

        // ============================================
        // AUTH FUNCTIONS
        // ============================================

        async function checkAuth() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                
                if (session?.user) {
                    setState({ user: session.user });
                    await loadUserProfile();
                } else {
                    setState({ view: 'login', user: null });
                }
            } catch (err) {
                console.error('Auth check failed:', err);
                setState({ view: 'login', user: null });
            }
        }

        async function signUp(email, password, marketingConsent) {
            setState({ authLoading: true, authError: null });
            
            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            marketing_consent: marketingConsent
                        }
                    }
                });
                
                if (error) throw error;
                
                // Create profile
                if (data.user) {
                    await supabaseClient.from('profiles').upsert({
                        id: data.user.id,
                        email: email,
                        marketing_consent: marketingConsent,
                        consent_timestamp: marketingConsent ? new Date().toISOString() : null,
                        tier: 'free'
                    });
                }
                
                setState({ 
                    authLoading: false, 
                    view: 'check-email'
                });
            } catch (err) {
                setState({ authError: err.message, authLoading: false });
            }
        }

        async function signIn(email, password) {
            setState({ authLoading: true, authError: null });
            
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });
                
                if (error) throw error;
                
                setState({ user: data.user, authLoading: false });
                await loadUserProfile();
            } catch (err) {
                setState({ authError: err.message, authLoading: false });
            }
        }

        async function resetPassword(email) {
            setState({ authLoading: true, authError: null });
            
            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: `${window.location.origin}?reset=true`
                });
                
                if (error) throw error;
                
                setState({ 
                    authLoading: false, 
                    view: 'reset-sent'
                });
            } catch (err) {
                setState({ authError: err.message, authLoading: false });
            }
        }

        async function signOut() {
            await supabaseClient.auth.signOut();
            setState({ 
                user: null, 
                userProfile: null, 
                userBeaches: [],
                view: 'login',
                data: null
            });
        }

        // ============================================
        // USER PROFILE & BEACHES
        // ============================================

        async function loadUserProfile() {
            if (!state.user) return;
            
            try {
                const { data: profile, error: profileError } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', state.user.id)
                    .single();
                
                if (profileError && profileError.code !== 'PGRST116') {
                    console.error('Profile load error:', profileError);
                }
                
                const { data: beaches, error: beachesError } = await supabaseClient
                    .from('user_beaches')
                    .select('beach_slug, position')
                    .eq('user_id', state.user.id)
                    .order('position');
                
                if (beachesError) {
                    console.error('Beaches load error:', beachesError);
                }
                
                const userBeaches = beaches?.map(b => b.beach_slug) || [];
                
                if (userBeaches.length === 0) {
                    await loadAvailableBeaches();
                    setState({ 
                        userProfile: profile,
                        userBeaches: [],
                        selectedBeaches: DEFAULT_BEACHES,
                        view: 'onboarding'
                    });
                } else {
                    setState({ 
                        userProfile: profile,
                        userBeaches: userBeaches,
                        view: 'dashboard'
                    });
                    fetchData();
                }
            } catch (err) {
                console.error('Failed to load user data:', err);
                setState({ view: 'dashboard', userBeaches: DEFAULT_BEACHES });
                fetchData();
            }
        }

        async function loadAvailableBeaches() {
            try {
                const res = await fetch(`${API_BASE}/locations`);
                const beaches = await res.json();
                setState({ availableBeaches: beaches });
            } catch (err) {
                console.error('Failed to load beaches:', err);
            }
        }

        async function saveUserBeaches(beaches) {
            if (!state.user) return;
            
            try {
                await supabaseClient
                    .from('user_beaches')
                    .delete()
                    .eq('user_id', state.user.id);
                
                const inserts = beaches.map((slug, index) => ({
                    user_id: state.user.id,
                    beach_slug: slug,
                    position: index
                }));
                
                const { error } = await supabaseClient
                    .from('user_beaches')
                    .insert(inserts);
                
                if (error) throw error;
                
                setState({ 
                    userBeaches: beaches,
                    view: 'dashboard'
                });
                fetchData();
            } catch (err) {
                console.error('Failed to save beaches:', err);
                alert('Failed to save your beaches. Please try again.');
            }
        }

        // ============================================
        // DASHBOARD DATA
        // ============================================

        async function fetchData() {
            setState({ loading: true, error: null });
            
            const beaches = state.userBeaches.length > 0 ? state.userBeaches : DEFAULT_BEACHES;
            
            try {
                const res = await fetch(
                    `${API_BASE}/dashboard?beaches=${beaches.join(',')}&mode=${state.mode}&time=${state.time}`
                );
                
                if (!res.ok) throw new Error('Failed to fetch data');
                
                const data = await res.json();
                
                setState({ 
                    data,
                    loading: false,
                    timeSlots: data.meta?.availableTimeSlots || FALLBACK_TIME_SLOTS
                });
            } catch (err) {
                setState({ error: err.message, loading: false });
            }
        }

        // ============================================
        // HELPER FUNCTIONS
        // ============================================

        function getTimeSince(isoString) {
            if (!isoString) return '';
            const mins = Math.floor((Date.now() - new Date(isoString)) / 60000);
            return mins < 1 ? 'updated just now' : `updated ${mins}m ago`;
        }

        function formatRecommendation(text) {
            return (text || '').replace(/\*\*(.*?)\*\*/g, '<strong class="text-gray-900">$1</strong>');
        }

        function getGradient(slug) {
            const gradients = {
                'rhossili': 'from-slate-400 to-blue-500',
                'barry-island': 'from-slate-300 to-slate-500',
                'tenby-south': 'from-blue-300 to-indigo-400',
                'langland': 'from-cyan-400 to-blue-500',
                'caswell': 'from-teal-400 to-cyan-500',
                'rest-bay': 'from-slate-500 to-indigo-600',
                'porthcawl': 'from-blue-400 to-purple-500'
            };
            return gradients[slug] || 'from-slate-400 to-slate-500';
        }

        function getColors(status) {
            const colors = {
                green: { badge: 'bg-emerald-500', border: 'border-l-emerald-500', bg: 'from-emerald-50 to-green-50' },
                amber: { badge: 'bg-amber-400', border: 'border-l-amber-400', bg: 'from-amber-50 to-yellow-50' },
                red: { badge: 'bg-red-400', border: 'border-l-red-400', bg: 'from-red-50 to-rose-50' }
            };
            return colors[status] || { badge: 'bg-gray-400', border: 'border-l-gray-400', bg: 'from-gray-50 to-gray-100' };
        }

        // Get unique locations for filtering
        function getUniqueLocations() {
            const locations = state.availableBeaches.map(b => b.location);
            return [...new Set(locations)].sort();
        }

        // Updated to support location filter
        function getFilteredBeaches(searchTerm = '') {
            const search = searchTerm.toLowerCase();
            return state.availableBeaches.filter(b => {
                // Apply location filter first
                if (state.locationFilter && b.location !== state.locationFilter) {
                    return false;
                }
                // Then apply search filter
                return b.name.toLowerCase().includes(search) || 
                       b.location.toLowerCase().includes(search);
            });
        }

        // Set location filter
        function setLocationFilter(location) {
            const newFilter = state.locationFilter === location ? null : location;
            setState({ locationFilter: newFilter });
            updateAllBeachesDisplay();
        }

        // Update all beaches display without full re-render
        function updateAllBeachesDisplay() {
            const searchInput = document.getElementById('all-beaches-search');
            const searchValue = searchInput ? searchInput.value : '';
            const filtered = getFilteredBeaches(searchValue);
            
            // Update location buttons
            const locationButtons = document.querySelectorAll('[data-location-filter]');
            locationButtons.forEach(btn => {
                const loc = btn.getAttribute('data-location-filter');
                if (loc === state.locationFilter) {
                    btn.className = 'px-3 py-1.5 text-sm rounded-full border transition-all bg-indigo-600 text-white border-indigo-600';
                } else {
                    btn.className = 'px-3 py-1.5 text-sm rounded-full border transition-all bg-white text-gray-700 border-gray-200 hover:border-indigo-300';
                }
            });
            
            // Update "All" button
            const allBtn = document.getElementById('location-filter-all');
            if (allBtn) {
                if (state.locationFilter === null) {
                    allBtn.className = 'px-3 py-1.5 text-sm rounded-full border transition-all bg-indigo-600 text-white border-indigo-600';
                } else {
                    allBtn.className = 'px-3 py-1.5 text-sm rounded-full border transition-all bg-white text-gray-700 border-gray-200 hover:border-indigo-300';
                }
            }
            
            // Update beach list
            const container = document.getElementById('all-beaches-list');
            if (!container) return;
            
            container.innerHTML = filtered.length === 0 ? `
                <div class="col-span-2 text-center text-gray-500 py-8">
                    no beaches found ${state.locationFilter ? `in ${state.locationFilter}` : ''}
                </div>
            ` : filtered.map(beach => `
                <div class="p-4 border border-gray-200 rounded-xl hover:border-indigo-300 hover:bg-indigo-50 transition-all cursor-pointer"
                     onclick="handleBeachClick('${beach.slug}')">
                    <div class="font-medium text-gray-900">${beach.name}</div>
                    <div class="text-sm text-gray-500">${beach.location}</div>
                    <div class="text-xs text-gray-400 mt-1">${beach.facing} facing • ${beach.region}</div>
                </div>
            `).join('');
            
            // Update count
            const countDisplay = document.getElementById('beach-count-display');
            if (countDisplay) {
                countDisplay.textContent = `showing ${filtered.length} of ${state.availableBeaches.length} beaches`;
            }
        }

        // Handle beach click in all beaches view
        function handleBeachClick(slug) {
            const beach = state.availableBeaches.find(b => b.slug === slug);
            if (!beach) return;
            
            if (!state.selectedBeaches.includes(slug) && state.userBeaches.length < MAX_FREE_BEACHES) {
                if (confirm(`Add ${beach.name} to your saved beaches?`)) {
                    const newBeaches = [...state.userBeaches, slug];
                    saveUserBeaches(newBeaches);
                }
            } else if (state.userBeaches.includes(slug)) {
                alert(`${beach.name} is already in your saved beaches!`);
            } else {
                alert(`You've reached the maximum of ${MAX_FREE_BEACHES} beaches. Remove one to add ${beach.name}.`);
            }
        }

        function updateBeachSearch(value) {
            const container = document.getElementById('beach-list-container');
            if (!container) return;
            
            const filtered = getFilteredBeaches(value);
            container.innerHTML = filtered.length === 0 ? `
                <p class="text-center text-gray-500 py-8">no beaches found</p>
            ` : filtered.map(beach => {
                const isSelected = state.selectedBeaches.includes(beach.slug);
                const canSelect = state.selectedBeaches.length < MAX_FREE_BEACHES;
                
                return `
                    <button 
                        onclick="toggleBeachSelection('${beach.slug}')"
                        class="w-full flex items-center justify-between p-4 rounded-xl border-2 transition-all ${
                            isSelected 
                                ? 'border-indigo-500 bg-indigo-50' 
                                : canSelect 
                                    ? 'border-gray-200 hover:border-gray-300' 
                                    : 'border-gray-100 opacity-50 cursor-not-allowed'
                        }"
                        ${!isSelected && !canSelect ? 'disabled' : ''}>
                        <div class="text-left">
                            <div class="font-medium text-gray-900">${beach.name}</div>
                            <div class="text-sm text-gray-500">${beach.location}</div>
                        </div>
                        ${isSelected ? `
                            <svg class="w-6 h-6 text-indigo-600" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                            </svg>
                        ` : ''}
                    </button>
                `;
            }).join('');
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            signIn(email, password);
        }

        function handleSignup(e) {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const marketing = document.getElementById('signup-marketing').checked;
            signUp(email, password, marketing);
        }

        function handleResetPassword(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            resetPassword(email);
        }

        function toggleBeachSelection(slug) {
            const selected = state.selectedBeaches;
            
            if (selected.includes(slug)) {
                setState({ selectedBeaches: selected.filter(s => s !== slug) });
            } else if (selected.length < MAX_FREE_BEACHES) {
                setState({ selectedBeaches: [...selected, slug] });
            }
        }

        function removeBeach(slug) {
            setState({ selectedBeaches: state.selectedBeaches.filter(s => s !== slug) });
        }

        function completeOnboarding() {
            if (state.selectedBeaches.length === 0) return;
            saveUserBeaches(state.selectedBeaches);
        }

        // ============================================
        // DRAG AND DROP FOR BEACH REORDERING
        // ============================================

        let draggedIndex = null;

        function handleDragStart(event, index) {
            draggedIndex = index;
            event.target.style.opacity = '0.5';
        }

        function handleDragEnd(event) {
            event.target.style.opacity = '1';
            draggedIndex = null;
        }

        function handleDragOver(event) {
            event.preventDefault();
            return false;
        }

        function handleDrop(event, dropIndex) {
            event.preventDefault();
            
            if (draggedIndex === null || draggedIndex === dropIndex) return;
            
            const newOrder = [...state.selectedBeaches];
            const draggedItem = newOrder[draggedIndex];
            
            newOrder.splice(draggedIndex, 1);
            newOrder.splice(dropIndex, 0, draggedItem);
            
            setState({ selectedBeaches: newOrder });
        }

        // ============================================
        // RENDER FUNCTIONS - SIDEBAR
        // ============================================

        function renderSidebar() {
            if (!state.showSidebar) return '';
            
            const menuItems = [
                { label: 'your beaches', view: 'dashboard', icon: '🏖️', show: state.user },
                { label: 'all beaches', view: 'all-beaches', icon: '🗺️', show: true },
                { label: 'swim groups', view: 'swim-groups', icon: '🏊', show: true },
                { label: 'your profile', view: 'profile', icon: '👤', show: state.user },
                { label: 'about shorecast', view: 'about', icon: 'ℹ️', show: true },
                { label: 'faqs', view: 'faqs', icon: '❓', show: true },
                { label: 'contact us', view: 'contact', icon: '✉️', show: true },
                { label: 'upgrade to premium', view: 'premium', icon: '⭐', show: state.user }
            ];
            
            return `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40" onclick="toggleSidebar()"></div>
                
                <div class="fixed top-0 right-0 h-full w-80 bg-white shadow-2xl z-50 overflow-y-auto">
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-8">
                            <h2 class="text-2xl font-light text-gray-900">menu</h2>
                            <button onclick="toggleSidebar()" 
                                class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 flex items-center justify-center text-xl">
                                ×
                            </button>
                        </div>
                        
                        ${state.user ? `
                            <div class="mb-8 p-4 bg-gradient-to-r from-indigo-50 to-purple-50 rounded-xl">
                                <p class="text-sm text-gray-500 mb-1">signed in as</p>
                                <p class="font-medium text-gray-900 truncate">${state.user.email}</p>
                            </div>
                        ` : ''}
                        
                        <nav class="space-y-1">
                            ${menuItems.filter(item => item.show).map(item => `
                                <button 
                                    onclick="navigateTo('${item.view}')"
                                    class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-50 transition-all ${
                                        state.view === item.view ? 'bg-gray-900 text-white shadow-lg' : ''
                                    }">
                                    <span class="text-xl">${item.icon}</span>
                                    <span>${item.label}</span>
                                </button>
                            `).join('')}
                        </nav>
                        
                        ${state.user ? `
                            <button onclick="signOut()" 
                                class="w-full mt-4 py-3 text-gray-500 hover:text-gray-700 text-sm">
                                sign out
                            </button>
                        ` : ''}
                        
                        <div class="mt-8 pt-8 border-t border-gray-200 text-center">
                            <p class="text-xs text-gray-400 mb-3">made in South Wales 🏴󠁧󠁢󠁷󠁬󠁳󠁿</p>
                            <div class="flex justify-center gap-3 text-xs">
                                <button onclick="navigateTo('privacy-policy')" class="text-gray-400 hover:text-indigo-600">
                                    privacy policy
                                </button>
                                <span class="text-gray-300">•</span>
                                <button onclick="navigateTo('terms')" class="text-gray-400 hover:text-indigo-600">
                                    terms of service
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================
        // RENDER FUNCTIONS - AUTH VIEWS
        // ============================================

        function renderLoading() {
            return `
                <div class="min-h-screen flex items-center justify-center">
                    <div class="text-center">
                        <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-4"></div>
                        <p class="text-gray-500">loading shorecast...</p>
                    </div>
                </div>
            `;
        }

        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center py-12 px-4 fade-in">
                    <div class="w-full max-w-md">
                        <div class="text-center mb-8">
                            <h1 class="text-4xl font-light text-gray-900 mb-2">shorecast</h1>
                            <p class="text-gray-500">your beaches, one glance</p>
                        </div>
                        
                        <div class="bg-white rounded-2xl shadow-lg p-8">
                            <h2 class="text-xl font-medium text-gray-900 mb-6">welcome back</h2>
                            
                            ${state.authError ? `
                                <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm">
                                    ${state.authError}
                                </div>
                            ` : ''}
                            
                            <form onsubmit="handleLogin(event)">
                                <div class="mb-4">
                                    <label class="block text-sm font-medium text-gray-700 mb-2">email</label>
                                    <input type="email" id="login-email" required
                                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all">
                                </div>
                                
                                <div class="mb-6">
                                    <label class="block text-sm font-medium text-gray-700 mb-2">password</label>
                                    <input type="password" id="login-password" required
                                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all">
                                </div>
                                
                                <button type="submit" 
                                    class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-xl font-medium hover:opacity-90 transition-all disabled:opacity-50"
                                    ${state.authLoading ? 'disabled' : ''}>
                                    ${state.authLoading ? 'signing in...' : 'sign in'}

                                    By using Shorecast, you agree to these terms. They're written in plain English because legal jargon helps no one.
                                </p>
                                
                                <h2 class="text-xl font-medium text-gray-900 mt-8 mb-4">the service</h2>
                                <p class="text-gray-600 mb-6">
                                    Shorecast provides beach condition information to help you decide when to swim. We aggregate data from multiple sources and provide recommendations, but ultimately you're responsible for your own safety in the water.
                                </p>
                                
                                <h2 class="text-xl font-medium text-gray-900 mt-8 mb-4">your responsibilities</h2>
                                <ul class="list-disc pl-6 text-gray-600 space-y-2">
                                    <li>Use Shorecast as one of several tools for making swimming decisions</li>
                                    <li>Always assess conditions yourself when you arrive at a beach</li>
                                    <li>Swim within your abilities</li>
                                    <li>Keep your account credentials secure</li>
                                </ul>
                                
                                <h2 class="text-xl font-medium text-gray-900 mt-8 mb-4">limitations</h2>
                                <p class="text-gray-600 mb-6">
                                    Our data comes from third parties and while we do our best to ensure accuracy, we can't guarantee it's always correct. Conditions can change rapidly. When in doubt, don't go out.
                                </p>
                                
                                <h2 class="text-xl font-medium text-gray-900 mt-8 mb-4">contact</h2>
                                <p class="text-gray-600">
                                    Questions? Email us at <a href="mailto:hello@shorecast.co.uk" class="text-indigo-600 hover:text-indigo-700">hello@shorecast.co.uk</a>
                                </p>
                            </div>
                        </div>
                    </div>
                    ${renderSidebar()}
                </div>
            `;
        }

        function renderSwimGroups() {
            return `
                <div class="min-h-screen py-12 px-4 fade-in">
                    <div class="max-w-3xl mx-auto">
                        <div class="mb-6">
                            <button onclick="navigateTo('dashboard')" 
                                class="text-indigo-600 hover:text-indigo-700 text-sm mb-4">
                                ← back to dashboard
                            </button>
                            <button onclick="toggleSidebar()" 
                                class="float-right w-10 h-10 flex items-center justify-center rounded-xl bg-white border border-gray-200 hover:bg-gray-50">
                                <div class="w-5 flex flex-col gap-1">
                                    <div class="h-0.5 bg-gray-600 rounded"></div>
                                    <div class="h-0.5 bg-gray-600 rounded"></div>
                                    <div class="h-0.5 bg-gray-600 rounded"></div>
                                </div>
                            </button>
                        </div>
                        
                        <div class="bg-white rounded-2xl shadow-lg p-8">
                            <h1 class="text-4xl font-light text-gray-900 mb-6">swim groups</h1>
                            
                            <div class="bg-gradient-to-r from-indigo-50 to-purple-50 rounded-xl p-6 mb-8">
                                <p class="text-lg text-gray-700 mb-4">🚧 Coming soon!</p>
                                <p class="text-gray-600">
                                    We're building a directory of local swim groups. Want to add yours? 
                                    Email us at <a href="mailto:hello@shorecast.co.uk" class="text-indigo-600 hover:text-indigo-700">hello@shorecast.co.uk</a>
                                </p>
                            </div>
                        </div>
                    </div>
                    ${renderSidebar()}
                </div>
            `;
        }

        // ============================================
        // MAIN RENDER FUNCTION
        // ============================================

        function render() {
            const app = document.getElementById('app');
            
            switch (state.view) {
                case 'loading':
                    app.innerHTML = renderLoading();
                    break;
                case 'login':
                    app.innerHTML = renderLogin();
                    break;
                case 'signup':
                    app.innerHTML = renderSignup();
                    break;
                case 'forgot-password':
                    app.innerHTML = renderForgotPassword();
                    break;
                case 'check-email':
                    app.innerHTML = renderCheckEmail();
                    break;
                case 'reset-sent':
                    app.innerHTML = renderResetSent();
                    break;
                case 'onboarding':
                    app.innerHTML = renderOnboarding();
                    break;
                case 'dashboard':
                    app.innerHTML = renderDashboard();
                    break;
                case 'about':
                    app.innerHTML = renderAbout();
                    break;
                case 'faqs':
                    app.innerHTML = renderFAQs();
                    break;
                case 'profile':
                    app.innerHTML = renderProfile();
                    break;
                case 'all-beaches':
                    app.innerHTML = renderAllBeaches();
                    break;
                case 'contact':
                    app.innerHTML = renderContact();
                    break;
                case 'premium':
                    app.innerHTML = renderPremium();
                    break;
                case 'privacy-policy':
                    app.innerHTML = renderPrivacyPolicy();
                    break;
                case 'terms':
                    app.innerHTML = renderTermsOfService();
                    break;
                case 'swim-groups':
                    app.innerHTML = renderSwimGroups();
                    break;
                default:
                    app.innerHTML = renderLoading();
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' && session) {
                setState({ user: session.user });
                loadUserProfile();
            } else if (event === 'SIGNED_OUT') {
                setState({ 
                    user: null, 
                    userProfile: null, 
                    userBeaches: [],
                    view: 'login',
                    data: null
                });
            }
        });

        checkAuth();
    </script>
</body>
</html>
